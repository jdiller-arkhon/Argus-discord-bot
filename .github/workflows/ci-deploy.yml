# Checks every push and pull request. On the default branch (and on manual runs) it then deploys
# the bot to Cloudflare and copies the bot settings from GitHub secrets/variables to the Worker.
# See docs/deploy.md.
name: CI and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Build the bot image
        run: docker build -f bots/argus/Dockerfile -t argus-bot:ci .

  deploy:
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Skipping deploy: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository (or production environment) secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.creds.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22 # wrangler 4 needs Node.js 22
          cache: pnpm
      - if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker and bot container
        if: steps.creds.outputs.ready == 'true'
        run: pnpm deploy:cloudflare

      # The bot registers its slash commands itself when it starts.
      - name: Copy bot settings to the Worker
        if: steps.creds.outputs.ready == 'true'
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          pnpm exec tsx deploy/cloudflare/scripts/write-secrets.ts "$RUNNER_TEMP/bot-settings.json"
          cd deploy/cloudflare
          npx wrangler secret bulk "$RUNNER_TEMP/bot-settings.json"
          rm -f "$RUNNER_TEMP/bot-settings.json"
